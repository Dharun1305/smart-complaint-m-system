<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SCMS — Complaint Details</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" /> 
</head>
<body class="bg-light">

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand fw-bold" href="dashboard.html">
        <img src="images/logo.png" alt="SmartCMS Logo" class="me-2" style="height: 45px;">
        SmartCMS
      </a>
      <!-- Filled dynamically by main.js -->
      <div class="ms-auto" id="authNavContainer"></div>
    </div>
  </nav>

  <main class="container py-4">
    <div class="row justify-content-center">
      <div class="col-lg-9">
        <a href="javascript:history.back()" class="btn btn-sm btn-outline-secondary mb-3">
          <i class="fas fa-arrow-left me-1"></i> Back
        </a>

        <div class="card shadow-sm">
          <div class="card-body">
            <!-- Title + meta -->
            <h4 class="mb-1" id="detailTitle">Loading Complaint Title...</h4>
            <div class="text-muted small mb-3">
              <span id="detailMeta"></span>
              —
              Status:
              <span id="detailStatus" class="badge bg-secondary">Loading...</span>
            </div>

            <hr>

            <!-- Description -->
            <h6 class="text-primary mb-2">
              <i class="fas fa-info-circle me-1"></i> Description:
            </h6>
            <div id="detailDescription" class="mb-4">
              <p class="text-muted">Loading description...</p>
            </div>

            <!-- Images -->
            <h6 class="text-primary mb-2">
              <i class="fas fa-camera me-1"></i> Attached Images:
            </h6>
            <div id="detailImages" class="mb-4 d-flex gap-2 flex-wrap">
              <p class="text-muted small">No images attached.</p>
            </div>

            <!-- Admin controls: shown only for admin by main.js -->
            <div id="adminControlsCard"
                 class="card bg-light border-warning mb-3"
                 style="display: none;">
              <div class="card-body p-3">
                <h6 class="card-title text-primary mb-2">
                  <i class="fas fa-gavel me-1"></i> Update Status
                </h6>
                <p class="small text-muted mb-2">
                  Only administrators can change the status of this complaint.
                </p>
                <form id="statusUpdateForm" class="d-flex flex-wrap gap-3 align-items-center">
                  <label for="newStatus" class="form-label mb-0 fw-bold small">
                    Current / New Status:
                  </label>
                  <select id="newStatus" name="newStatus" class="form-select form-select-sm w-auto">
                    <option value="open">Open</option>
                    <option value="in_progress">In Progress</option>
                    <option value="resolved">Resolved</option>
                  </select>
                  <button type="submit" class="btn btn-sm btn-warning">
                    Save Status
                  </button>
                  <div id="statusMessage" class="small mt-0"></div>
                </form>
              </div>
            </div>

          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="py-4 bg-white text-center border-top mt-5">
    <div class="container">
      <p class="mb-0 small text-muted">SmartCMS &copy; 2024. All rights reserved.</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
