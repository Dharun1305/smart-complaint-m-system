<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SCMS — My Complaints</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" /> 
</head>
<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand fw-bold" href="dashboard.html">
        <img src="images/logo.png" alt="SmartCMS Logo" class="me-2" style="height: 45px;">
        SmartCMS
      </a>
      <div class="ms-auto" id="authNavContainer">
        </div>
    </div>
  </nav>

  <main class="container py-4">
    <h4 class="mb-3">My Complaints</h4>

    <div class="mb-3 d-flex gap-2 align-items-center">
      <select id="filterStatus" class="form-select w-auto">
        <option value="">All Statuses</option>
        <option value="open">Open</option>
        <option value="in_progress">In Progress</option>
        <option value="resolved">Resolved</option>
      </select>
      <input id="filterQuery" class="form-control" placeholder="Search by title or category" />
    </div>

    <div class="card shadow-sm">
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover align-middle m-0">
            <thead>
              <tr>
                <th scope="col" style="width: 35%">Title / ID</th>
                <th class="d-none d-sm-table-cell" scope="col" style="width: 20%">Category</th>
                <th scope="col" style="width: 15%">Status</th>
                <th class="d-none d-md-table-cell" scope="col" style="width: 15%">Date</th>
                <th scope="col" style="width: 15%">Action</th>
              </tr>
            </thead>
            <tbody id="complaintsListBody">
              </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <footer class="py-4 bg-white text-center border-top mt-5">
    <div class="container">
      <p class="mb-0 small text-muted">SmartCMS &copy; 2024. All rights reserved.</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
