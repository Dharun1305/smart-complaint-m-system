<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SCMS — Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" /> 
</head>
<body class="bg-light">

  <!-- Navbar filled by JS -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand fw-bold" href="dashboard.html">
        <img src="images/logo.png" alt="SmartCMS Logo" class="me-2" style="height: 45px;">
        SmartCMS
      </a>
      <div id="authNavContainer" class="d-flex ms-auto">
        <!-- Filled dynamically -->
      </div>
    </div>
  </nav>

  <main class="container py-5">
    <!-- Welcome + CTA -->
    <div class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom">
      <div>
        <h2 class="fw-light">
          Welcome back, <span id="welcomeUserName" class="fw-bold text-primary">User</span>!
        </h2>
        <p class="text-muted mb-0">Overview of your submitted grievances.</p>
      </div>
      <div>
        <a class="btn btn-primary btn-lg shadow" href="submit_complaint.html">
          <i class="fas fa-bullhorn me-2"></i> Report a New Issue
        </a>
      </div>
    </div>

    <!-- Stat cards -->
    <div class="row g-4 mb-5">
      <!-- Open -->
      <div class="col-md-4">
        <a href="complaints_list.html?status=open" class="text-decoration-none card-hover-effect" data-status="open">
          <div class="card p-4 bg-danger-subtle border-danger h-100">
            <div class="d-flex align-items-center">
              <i class="fas fa-exclamation-triangle fa-2x text-danger me-3"></i>
              <div>
                <div class="small text-danger fw-bold stat-card-label">OPEN ISSUES</div>
                <h3 id="statOpenCount" class="display-6 text-danger fw-bold mb-0">0</h3>
              </div>
            </div>
          </div>
        </a>
      </div>

      <!-- In progress -->
      <div class="col-md-4">
        <a href="complaints_list.html?status=in_progress" class="text-decoration-none card-hover-effect" data-status="in_progress">
          <div class="card p-4 bg-primary-subtle border-primary h-100">
            <div class="d-flex align-items-center">
              <i class="fas fa-tools fa-2x text-primary me-3"></i>
              <div>
                <div class="small text-primary fw-bold stat-card-label">IN PROGRESS</div>
                <h3 id="statInProgressCount" class="display-6 text-primary fw-bold mb-0">0</h3>
              </div>
            </div>
          </div>
        </a>
      </div>

      <!-- Resolved -->
      <div class="col-md-4">
        <a href="complaints_list.html?status=resolved" class="text-decoration-none card-hover-effect" data-status="resolved">
          <div class="card p-4 bg-success-subtle border-success h-100">
            <div class="d-flex align-items-center">
              <i class="fas fa-check-circle fa-2x text-success me-3"></i>
              <div>
                <div class="small text-success fw-bold stat-card-label">RESOLVED</div>
                <h3 id="statResolvedCount" class="display-6 text-success fw-bold mb-0">0</h3>
              </div>
            </div>
          </div>
        </a>
      </div>
    </div>

    <!-- Total (optional, used by JS) -->
    <div class="row mb-4">
      <div class="col-12">
        <div class="card p-3 bg-secondary-subtle border-secondary">
          <div class="d-flex justify-content-between align-items-center">
            <div class="small text-secondary fw-bold">TOTAL COMPLAINTS</div>
            <h3 id="statTotalCount" class="mb-0 fw-bold text-secondary">0</h3>
          </div>
        </div>
      </div>
    </div>

    <!-- Recent activity -->
    <div class="row g-4">
      <div class="col-12">
        <div class="card p-4">
          <h4 class="mb-3"><i class="fas fa-history me-2 text-muted"></i> Recent Activity</h4>
          <p class="small text-muted border-bottom pb-3">Your last few submitted complaints.</p>

          <div class="mt-3">
            <ul id="recentComplaintsList" class="list-group list-group-flush">
              <!-- JS will insert items here -->
            </ul>
            <div class="text-center mt-4">
              <a href="complaints_list.html" class="btn btn-outline-primary">
                <i class="fas fa-eye me-2"></i> View All Complaints
              </a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
