<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SCMS — Register</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">
        <img src="images/logo.png" alt="SmartCMS Logo" class="me-2" style="height: 45px;">
        SmartCMS
      </a>
      <div id="authNavContainer"></div>
    </div>
  </nav>

  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-7 col-lg-6">
        <div class="card shadow-lg">
          <div class="card-body p-4">
            <h4 class="card-title mb-3 text-primary">Create Your Account</h4>
            <form id="registerForm" action="#" method="post" novalidate>
              <div class="row g-2">
                <div class="col-md-6 mb-3">
                  <label for="firstName" class="form-label">First name</label>
                  <input id="firstName" name="firstName" type="text" class="form-control" required />
                  <div class="invalid-feedback">First name is required.</div>
                </div>
                <div class="col-md-6 mb-3">
                  <label for="lastName" class="form-label">Last name</label>
                  <input id="lastName" name="lastName" type="text" class="form-control" required />
                  <div class="invalid-feedback">Last name is required.</div>
                </div>
              </div>
              <div class="mb-3">
                <label for="regEmail" class="form-label">Email</label>
                <input id="regEmail" name="email" type="email" class="form-control" required />
                <div class="invalid-feedback">Please enter a valid email.</div>
              </div>
              <div class="mb-3">
                <label for="regPhone" class="form-label">Phone (optional)</label>
                <input id="regPhone" name="phone" type="tel" class="form-control" />
                <div class="form-text">Optional, but recommended for communication.</div>
              </div>
              <div class="mb-3">
                <label for="regPassword" class="form-label">Password</label>
                <input id="regPassword" name="password" type="password" class="form-control" minlength="6" required />
                <div class="invalid-feedback">Password must be at least 6 characters.</div>
              </div>
              <div class="d-flex justify-content-between align-items-center">
                <a href="login.html" class="small text-muted">Already have an account?</a>
                <button class="btn btn-primary" type="submit">Register</button>
              </div>
              <div id="registerMessage" class="small mt-2"></div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
